<!DOCTYPE html>
  <html lang="ru">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Вход - PRIZMATIC</title>
      <link rel="stylesheet" href="style.css">

      <!-- VK ID SDK -->
      <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
      <script src="auth-vk.js" defer></script>

      <style>
          .auth-container {
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
              background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
          }
          .auth-card {
              background: white;
              padding: 40px;
              border-radius: 24px;
              max-width: 400px;
              width: 100%;
              box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
          }
          h1 {
              text-align: center;
              color: #2e7d32;
              margin-bottom: 30px;
          }
          #vk-auth-container {
              display: flex;
              justify-content: center;
              margin: 20px 0;
          }
          .message {
              padding: 12px;
              border-radius: 8px;
              margin: 10px 0;
              text-align: center;
              display: none;
          }
          .error { background: #ffebee; color: #c62828; }
          .success { background: #e8f5e9; color: #2e7d32; }
      </style>
  </head>
  <body>
      <div class="auth-container">
          <div class="auth-card">
              <h1>PRIZMATIC</h1>
              <p style="text-align: center; color: #666; margin-bottom: 20px;">
                  Войдите через VK ID
              </p>

              <div id="vk-auth-container"></div>

              <div id="error-msg" class="message error"></div>
              <div id="success-msg" class="message success"></div>
          </div>
      </div>

      <script>
          async function initVK() {
              try {
                  const vkAuth = new VKAuthManager({
                      appId: 54250661,
                      redirectUrl: 'https://prizmatic-2004.vercel.app/',
                      scope: 'phone email'
                  });

                  await vkAuth.login(
                      'vk-auth-container',
                      (response) => {
                          document.getElementById('success-msg').textContent = 'Success!';
                          document.getElementById('success-msg').style.display = 'block';
                          setTimeout(() => window.location.href = 'index.html', 1000);
                      },
                      (error) => {
                          if (error.text !== 'timeout') {
                              document.getElementById('error-msg').textContent = 'Error. Try again.';
                              document.getElementById('error-msg').style.display = 'block';
                          }
                      }
                  );
              } catch (e) {
                  console.error(e);
              }
          }

          if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', initVK);
          } else {
              initVK();
          }
      </script>
  </body>
  </html>
