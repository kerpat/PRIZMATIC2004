    <script>
        // Detect platform
        const isAndroidApp = typeof AndroidInterface !== 'undefined';
        const isTelegramMiniApp = window.Telegram?.WebApp?.initData;
        const isWebBrowser = !isAndroidApp && !isTelegramMiniApp;

        console.log('[Registration] Platform detected:', {
            isAndroidApp,
            isTelegramMiniApp,
            isWebBrowser
        });

        // Show platform badge
        const platformInfo = document.getElementById('platform-info');
        if (isAndroidApp) {
            platformInfo.innerHTML = '<span class="platform-badge">=ñ Android App</span>';
        } else if (isTelegramMiniApp) {
            platformInfo.innerHTML = '<span class="platform-badge"> Telegram Mini App</span>';
        } else {
            platformInfo.innerHTML = '<span class="platform-badge">< Web Browser</span>';
        }

        // UI Elements
        const loadingScreen = document.getElementById('loading-screen');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const vkAuthSection = document.getElementById('vk-auth-section');
        const telegramAuthSection = document.getElementById('telegram-auth-section');

        // Show/hide loading screen
        function showLoading(show) {
            loadingScreen.classList.toggle('active', show);
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => errorMessage.classList.remove('active'), 5000);
        }

        // Show success message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('active');
            setTimeout(() => successMessage.classList.remove('active'), 3000);
        }

        // Initialize authentication based on platform
        async function initAuth() {
            if (isTelegramMiniApp) {
                // Show only Telegram auth for Telegram Mini App
                vkAuthSection.style.display = 'none';
                telegramAuthSection.style.display = 'block';

                // Setup Telegram auth button
                document.getElementById('telegram-auth-btn').addEventListener('click', () => {
                    // This will be handled by existing Telegram flow
                    window.location.href = 'index.html';
                });

            } else {
                // Show VK ID auth for Android App and Web Browser
                vkAuthSection.style.display = 'block';
                telegramAuthSection.style.display = 'none';

                // Initialize VK Auth
                await initVKAuth();
            }
        }

        // Initialize VK ID authentication
        async function initVKAuth() {
            try {
                console.log('[VK Auth] Initializing...');

                // Wait for VKAuthManager to load
                if (typeof VKAuthManager === 'undefined') {
                    await new Promise((resolve) => {
                        const checkManager = setInterval(() => {
                            if (typeof VKAuthManager !== 'undefined') {
                                clearInterval(checkManager);
                                resolve();
                            }
                        }, 100);
                    });
                }

                // Create VK Auth instance
                const vkAuth = new VKAuthManager({
                    appId: 54250661,
                    redirectUrl: 'https://prizmatic-2004.vercel.app/',
                    scope: 'phone email'
                });

                // Start login flow
                await vkAuth.login(
                    'vk-auth-container',
                    // Success callback
                    (response) => {
                        console.log('[VK Auth] Login successful:', response);
                        showSuccess('E>4 2K?>;=5= CA?5H=>!');

                        // Redirect to main app after 1 second
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    },
                    // Error callback
                    (error) => {
                        console.error('[VK Auth] Login error:', error);
                        showError('H81:0 2E>40. >?@>1C9B5 5I5 @07.');
                        showLoading(false);
                    }
                );

            } catch (error) {
                console.error('[VK Auth] Initialization error:', error);
                showError('5 C40;>AL 703@C78BL VK ID. 1=>28B5 AB@0=8FC.');
            }
        }

        // Check if user is already logged in
        function checkExistingAuth() {
            const userId = localStorage.getItem('userId');
            const isRegistered = localStorage.getItem('isRegistered');

            if (userId && isRegistered === 'true') {
                console.log('[Auth] User already logged in, redirecting...');
                window.location.href = 'index.html';
                return true;
            }
            return false;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in
            if (checkExistingAuth()) {
                showLoading(true);
                return;
            }

            // Initialize auth based on platform
            initAuth().catch(error => {
                console.error('[Auth] Initialization failed:', error);
                showError('H81:0 8=8F80;870F88. 1=>28B5 AB@0=8FC.');
            });
        });

        // Handle page transitions
        const appScreen = document.querySelector('.registration-container');
        if (appScreen) {
            appScreen.classList.add('page-enter');
            requestAnimationFrame(() => {
                appScreen.classList.remove('page-enter');
                appScreen.classList.add('page-enter-active');
            });
        }
    </script>
