<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔬 Тест Payment</title>
    <style>
        body {
            font-family: system-ui;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .status {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .success { border-left: 4px solid #4caf50; }
        .error { border-left: 4px solid #f44336; }
        .warning { border-left: 4px solid #ff9800; }
        button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            margin: 10px 0;
            cursor: pointer;
            width: 100%;
        }
        button:active {
            transform: scale(0.98);
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔬 Тест PaymentActivity</h1>
    
    <div id="status"></div>
    
    <button onclick="checkInterface()">1️⃣ Проверить window.PaymentNative</button>
    <button onclick="testPayment()">2️⃣ Тест оплаты (ЮКасса тестовая)</button>
    <button onclick="checkCapacitor()">3️⃣ Проверить Capacitor</button>
    <button onclick="clearLogs()">🗑️ Очистить логи</button>
    
    <h2>📋 Логи:</h2>
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'warning';
            
            logs.innerHTML = `
                <div class="status ${className}">
                    <strong>[${timestamp}]</strong> ${message}
                </div>
            ` + logs.innerHTML;
            
            console.log(`[${timestamp}] ${message}`);
        }

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'warning';
            status.innerHTML = `<div class="status ${className}">${message}</div>`;
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            console.clear();
            updateStatus('Логи очищены', 'success');
        }

        function checkInterface() {
            log('🔍 Проверяем window.PaymentNative...', 'info');
            
            if (typeof window.PaymentNative === 'undefined') {
                log('❌ window.PaymentNative НЕ НАЙДЕН!', 'error');
                updateStatus('❌ PaymentNative не найден! Проверьте MainActivity.java', 'error');
                return;
            }
            
            log('✅ window.PaymentNative найден!', 'success');
            log(`Тип: ${typeof window.PaymentNative}`, 'success');
            log(`Методы: ${Object.keys(window.PaymentNative)}`, 'success');
            
            if (typeof window.PaymentNative.openPayment === 'function') {
                log('✅ Метод openPayment() доступен!', 'success');
                updateStatus('✅ PaymentNative работает!', 'success');
            } else {
                log('❌ Метод openPayment() НЕ НАЙДЕН!', 'error');
                updateStatus('❌ Метод openPayment() не найден!', 'error');
            }
        }

        function testPayment() {
            log('🧪 Запуск тестовой оплаты...', 'info');
            
            if (typeof window.PaymentNative === 'undefined') {
                log('❌ window.PaymentNative не найден! Сначала запустите проверку.', 'error');
                updateStatus('❌ Сначала проверьте интерфейс!', 'error');
                return;
            }
            
            // Тестовый URL ЮКассы
            const testUrl = 'https://yoomoney.ru/checkout/payments/v2/contract';
            
            try {
                log(`📍 URL: ${testUrl}`, 'info');
                log('🚀 Вызываем PaymentNative.openPayment()...', 'info');
                
                window.PaymentNative.openPayment(testUrl);
                
                log('✅ PaymentActivity должна открыться!', 'success');
                updateStatus('✅ PaymentActivity запущена!', 'success');
            } catch (err) {
                log(`❌ Ошибка: ${err.message}`, 'error');
                log(`Stack: ${err.stack}`, 'error');
                updateStatus(`❌ Ошибка: ${err.message}`, 'error');
            }
        }

        function checkCapacitor() {
            log('🔍 Проверяем Capacitor...', 'info');
            
            const checks = {
                'window.Capacitor': typeof window.Capacitor !== 'undefined',
                'Capacitor.isNativePlatform()': window.Capacitor ? window.Capacitor.isNativePlatform() : false,
                'Capacitor.Plugins': window.Capacitor && window.Capacitor.Plugins ? Object.keys(window.Capacitor.Plugins) : []
            };
            
            log(`<pre>${JSON.stringify(checks, null, 2)}</pre>`, 'info');
            
            if (checks['window.Capacitor']) {
                updateStatus('✅ Capacitor найден', 'success');
            } else {
                updateStatus('❌ Capacitor не найден', 'error');
            }
        }

        // Автоматическая проверка при загрузке
        window.addEventListener('load', () => {
            log('🎬 Страница загружена', 'info');
            setTimeout(checkInterface, 500);
        });

        // Перехватываем все ошибки
        window.addEventListener('error', (e) => {
            log(`💥 JavaScript Error: ${e.message}`, 'error');
        });
    </script>
</body>
</html>
