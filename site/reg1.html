<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRIZMATIC</title>
<link rel="stylesheet" href="style.css?v=13.2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
<script src="auth-vk.js" defer></script>
<style>
.registration-screen{width:100%;min-height:100vh;background-color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.registration-content{width:100%;max-width:400px;text-align:center}
.logo-section{margin-bottom:40px}
.logo-section h1{font-size:2.5rem;font-weight:800;color:var(--dark-green);margin-bottom:8px}
.logo-section p{font-size:1rem;color:#666;font-weight:400}
.auth-card{background:var(--card-bg);border-radius:24px;padding:32px 24px;box-shadow:0 4px 20px rgba(13,115,119,0.08);margin-bottom:20px}
.auth-card h2{font-size:1.1rem;font-weight:600;color:var(--dark-green);margin-bottom:20px}
#vk-auth-container{display:flex;justify-content:center;margin:16px 0}
.telegram-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#2AABEE 0%,#229ED9 100%);color:white;border:none;border-radius:16px;padding:16px 32px;font-size:16px;font-weight:600;cursor:pointer;width:100%;max-width:340px;box-shadow:0 4px 12px rgba(42,171,238,0.3);transition:transform 0.2s}
.telegram-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(42,171,238,0.4)}
.telegram-btn svg{width:24px;height:24px}
.info-text{font-size:13px;color:#666;line-height:1.6;margin-top:20px}
.info-text a{color:var(--dark-green);text-decoration:none;font-weight:500}
.error-message,.success-message{display:none;padding:14px 16px;border-radius:12px;margin-top:16px;font-size:14px;font-weight:500}
.error-message{background:#ffebee;color:#c62828}
.success-message{background:#e8f5e9;color:#2e7d32}
.error-message.active,.success-message.active{display:block}
.loading-screen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:1000;flex-direction:column;align-items:center;justify-content:center}
.loading-screen.active{display:flex}
.loading-spinner{border:4px solid var(--card-bg);border-top:4px solid var(--dark-green);border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loading-screen h2{color:var(--dark-green)}
.loading-screen p{color:#666}
.platform-badge{display:inline-block;background:var(--light-blue-bg);color:var(--dark-green);padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;margin-bottom:20px}
</style>
</head>
<body>
<div class="loading-screen" id="loading-screen">
<div class="loading-spinner"></div>
<h2>Wait...</h2>
<p>Loading</p>
</div>
<div class="registration-screen">
<div class="registration-content">
<div class="logo-section">
<h1>PRIZMATIC</h1>
<p>E-bike rental</p>
</div>
<div id="platform-badge"></div>
<div class="auth-card">
<h2>Login</h2>
<div id="vk-auth-section">
<div id="vk-auth-container"></div>
</div>
<div class="telegram-section" id="telegram-section" style="display:none">
<button class="telegram-btn" id="telegram-btn">
<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.14.121.098.155.23.171.324.016.062.036.201.02.31z"/>
</svg>
Telegram
</button>
</div>
</div>
<div class="error-message" id="error-message"></div>
<div class="success-message" id="success-message"></div>
<div class="info-text">
By logging in, you accept<br>
<a href="/privacy" target="_blank">privacy policy</a>
</div>
</div>
</div>
<script>
const isAndroidApp=typeof AndroidInterface!=='undefined';
const isTelegramMiniApp=window.Telegram?.WebApp?.initData;
const isWebBrowser=!isAndroidApp&&!isTelegramMiniApp;
console.log('[Platform]',{isAndroidApp,isTelegramMiniApp,isWebBrowser});
const loadingScreen=document.getElementById('loading-screen');
const errorMessage=document.getElementById('error-message');
const successMessage=document.getElementById('success-message');
const vkAuthSection=document.getElementById('vk-auth-section');
const telegramSection=document.getElementById('telegram-section');
const platformBadge=document.getElementById('platform-badge');
if(isAndroidApp){platformBadge.innerHTML='<span class="platform-badge">Android</span>'}
else if(isTelegramMiniApp){platformBadge.innerHTML='<span class="platform-badge">Telegram</span>'}
else{platformBadge.innerHTML='<span class="platform-badge">Web</span>'}
function showLoading(show){loadingScreen.classList.toggle('active',show)}
function showError(msg){errorMessage.textContent=msg;errorMessage.classList.add('active');setTimeout(()=>errorMessage.classList.remove('active'),5000)}
function showSuccess(msg){successMessage.textContent=msg;successMessage.classList.add('active');setTimeout(()=>successMessage.classList.remove('active'),3000)}
function checkExistingAuth(){const userId=localStorage.getItem('userId');const isRegistered=localStorage.getItem('isRegistered');if(userId&&isRegistered==='true'){console.log('[Auth] Logged in');window.location.href='index.html';return true}return false}
async function initVKAuth(){try{console.log('[VK] Init');if(typeof VKAuthManager==='undefined'){await new Promise((resolve)=>{const check=setInterval(()=>{if(typeof VKAuthManager!=='undefined'){clearInterval(check);resolve()}},100)})}
const vkAuth=new VKAuthManager({appId:54250661,redirectUrl:'https://prizmatic-2004.vercel.app/',scope:'phone email'});
await vkAuth.login('vk-auth-container',(response)=>{console.log('[VK] Success');showSuccess('Success!');setTimeout(()=>window.location.href='index.html',1000)},(error)=>{console.error('[VK] Error:',error);if(error.text!=='timeout'){showError('Error')}});
console.log('[VK] Ready')}catch(error){console.error('[VK] Init error:',error);if(!error.message?.includes('timeout')){showError('VK ID load failed')}}}
async function initAuth(){if(checkExistingAuth()){showLoading(true);return}
if(isTelegramMiniApp){vkAuthSection.style.display='none';telegramSection.style.display='block';document.getElementById('telegram-btn').addEventListener('click',()=>{window.location.href='index.html'})}else{vkAuthSection.style.display='block';telegramSection.style.display='none';await initVKAuth()}}
document.addEventListener('DOMContentLoaded',()=>{initAuth().catch(error=>{console.error('[Auth] Failed:',error);showError('Init error')})});
</script>
</body>
</html>
